name: Build and publish site

# Turns the files in incoming/ into searchable card data and publishes docs/ to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [claude/tender-johnson-c5imou, main]
    paths:
      - "incoming/**"
      - "docs/**"
      - "tools/**"
      - "app/ingest/**"
      - "app/db.py"
      - "app/embed.py"
      - "requirements-site.txt"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - run: pip install -r requirements-site.txt

      - name: LibreOffice (only when .doc, .rtf or .odt files are present)
        run: |
          if find incoming -type f \( -iname '*.doc' -o -iname '*.rtf' -o -iname '*.odt' \) | grep -q .; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
          fi

      - name: Build card data from incoming/
        run: python tools/build_site.py sync incoming

      - name: Save the updated card data to the repository
        run: |
          git config user.name "card-wizard-bot"
          git config user.email "card-wizard-bot@users.noreply.github.com"
          git add -A docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Update card data"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
